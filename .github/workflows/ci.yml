# CI definition only. Nothing here is pushed or enabled by the repository tooling; review before turning on.
# Placeholder public env values below are NOT secrets (they only let `next build` / `expo export` run offline).
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  EXPO_PUBLIC_SUPABASE_URL: http://localhost:54321
  EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # ESLint lives in its own toolchain (tools/lint) because typescript-eslint needs the TypeScript 6 JS API
      - run: npm run lint:install
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build -w apps/web
      - run: npm run build -w apps/admin

  mobile-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo export --platform android
        working-directory: apps/mobile
